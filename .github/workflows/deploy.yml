name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Run the gate on PRs too, so a branch is known-green before it reaches main.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # TZ is pinned by the test launcher: the timezone regression has to run under a
      # viewer zone that differs from the sites it exercises, or it passes trivially.
      - name: Test
        run: npm test

      # Keep the production bundle inside the PR gate. The deploy job repeats the
      # build on pushes to main with production secrets, but a PR must also prove
      # that the application can be bundled before it is merged.
      - name: Build
        run: npm run build
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_SUBSCRIBE_WORKER_URL: ${{ secrets.VITE_SUBSCRIBE_WORKER_URL }}

  build-and-deploy:
    # Deploy starts only after the tests and validation build succeed.
    needs: test
    # Only a real push to main publishes. PR and manual runs stop at the test job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_SUBSCRIBE_WORKER_URL: ${{ secrets.VITE_SUBSCRIBE_WORKER_URL }}

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
